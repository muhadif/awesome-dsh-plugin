url: https://github.com/muhadif/dsh-atlassian-mcp
name: muhadif/dsh-atlassian-mcp
category: tools
description:
  en: 'Confluence and Jira through Atlassian''s remote MCP server, with the endpoint owned by a settings card instead of the profile patch: the plugin registers the server at runtime through ctx.mcpManager, so switching between the v2 all-product endpoint, the legacy v1 one and a custom https URL reconnects it without a restart, and the card shows the live connection state so a pending OAuth consent reads differently from a failure. A Host half registers the server and serves the card''s route; a browser half renders the card. The bundle carries no credentials — mcp-remote handles the OAuth grant once and caches it under ~/.mcp-auth — and the tools arrive as mcp__atlassian__* (CQL search, pages, comments, JQL issues, transitions, worklogs, projects).'
  zh: '通过 Atlassian 远程 MCP 接入 Confluence 与 Jira，端点由设置卡片管理而不是写在 profile patch 里：插件在运行时经 ctx.mcpManager 注册服务器，因此在 v2 全产品端点、旧版 v1 端点和自定义 https 地址之间切换即可重连，无需重启；卡片同时显示实时连接状态，把「等待 OAuth 授权」和「连接失败」区分开。Host 半边负责注册服务器并提供卡片路由，浏览器半边负责渲染卡片。包内不含任何凭据——OAuth 授权由 mcp-remote 完成一次并缓存在 ~/.mcp-auth——工具以 mcp__atlassian__* 形式出现（CQL 搜索、页面、评论、JQL 问题、状态流转、工时、项目）。'
