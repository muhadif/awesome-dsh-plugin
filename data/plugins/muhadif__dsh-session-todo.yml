url: https://github.com/muhadif/dsh-session-todo
name: muhadif/dsh-session-todo
category: workflow
description:
  en: 'PRDs and a kanban task board per workspace: each PRD is an entity owned by the session that wrote it and backs many tasks, so a card''s PRD chip opens the spec rendered as Markdown, and clicking a card opens a Jira-like detail panel with status, owner, priority, labels, linked PRD, the sessions that touched it, description, comments and history. Three tools let the agent write the PRD, claim a task before working, comment and close it; a toggle narrows the board to the current session or the whole workspace, and a strip under the composer shows just this session''s work. One board per working directory, stored as JSON under DSH_HOME.'
